            <g stroke="rgba(30,144,255,.12)" stroke-width="1">

              <path d="M300 140 L 900 140 M400 80 L 1000 80" stroke="rgba(30,144,255,.08)"/>

              <!-- 4号棚 绿 -->
              <g transform="translate(660,0)"><path d="M250 320 L 400 320 L 450 295 L 300 295 Z" fill="rgba(34,197,94,.15)" stroke="rgba(34,197,94,.6)"/><path d="M250 320 L 250 380 L 400 380 L 400 320 Z" fill="rgba(14,34,54,.6)" stroke="rgba(30,144,255,.3)"/><path d="M400 320 L 400 380 L 450 355 L 450 295 Z" fill="rgba(14,34,54,.8)" stroke="rgba(30,144,255,.3)"/><path d="M250 320 L 300 295 L 450 295 L 400 320" fill="url(#roof)" stroke="rgba(34,197,94,.6)"/><text x="345" y="365" text-anchor="middle" font-size="11" fill="#22C55E" font-family="var(--font-num)">4号棚 26.4℃</text></g>

            <path d="M150 440 L 850 440" stroke="rgba(30,144,255,.2)" stroke-width="20" stroke-linecap="round"/>

            <div class="ds-metric"><span class="ds-metric__label">温度 / 湿度</span><span class="ds-metric__val" style="font-size:16px;color:#E63946">32.0℃ / 68%</span></div>
            <div class="ds-metric"><span class="ds-metric__label">今日农事</span><span class="ds-metric__val" style="font-size:16px">1 项</span></div>
            <div class="ds-metric"><span class="ds-metric__label">产量预估</span><span class="ds-metric__val" style="font-size:16px">1.2 吨</span></div>
            <div class="flex gap-2 mt-3"><button class="btn btn--sm" style="background:transparent;border:1px solid var(--dark-line);color:var(--dark-fg)">环境</button><button class="btn btn--sm" style="background:transparent;border:1px solid var(--dark-line);color:var(--dark-fg)">视频</button><button class="btn btn--sm" style="background:var(--berry);color:#fff;border-color:var(--berry)">远程控制</button></div>
          </div>

          <!-- 图例 左下 -->
          <div class="hud hud--bl ds-legend"><span><i class="ds-dot ds-dot--ok"></i>正常</span><span><i class="ds-dot ds-dot--warn"></i>预警</span><span><i class="ds-dot ds-dot--danger"></i>故障</span></div>
        </div>
