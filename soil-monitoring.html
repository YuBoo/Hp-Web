<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>土壤与气象监测 · AI 决策平台 — 黄陂草莓数字农事平台</title>
  <link rel="stylesheet" href="css/shared.css">
  <style>
    /* ── 页面专用样式 ── */

    /* 全宽覆盖 + 纵向撑满 */
    .content {
      max-width: none;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .monitor-layout {
      flex: 1;
      display: flex;
      gap: var(--space-4);
      align-items: stretch;
    }

    /* 左列表 + 右详情 水平分栏（继承 .monitor-layout 的 flex:1 已在上方定义） */

    .panel {
      background: var(--surface);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-soft);
    }

    .panel-title {
      font-size: var(--text-sm);
      font-weight: 600;
      color: var(--fg);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-title svg {
      width: 16px;
      height: 16px;
      color: var(--accent);
    }

    .panel-count {
      font-size: 11px;
      color: var(--muted);
      background: var(--border-soft);
      padding: 1px 8px;
      border-radius: var(--radius-pill);
    }

    /* ── 左列：设备列表 ── */
    .left-col {
      width: 300px;
      min-width: 280px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }

    .left-col .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .device-table-wrap {
      overflow-y: auto;
      flex: 1;
    }

    /* 搜索栏 */
    .search-bar {
      margin: 8px 10px;
      position: relative;
    }
    .search-bar input {
      width: 100%;
      padding: 6px 10px 6px 28px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 12px;
      color: var(--fg);
      background: var(--surface);
      outline: none;
      transition: border-color var(--motion-fast);
    }
    .search-bar input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(24,144,255,0.1);
    }
    .search-bar input::placeholder {
      color: var(--muted);
    }
    .search-bar svg {
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      color: var(--muted);
      pointer-events: none;
    }

    .device-table {
      width: 100%;
      border-collapse: collapse;
    }

    .device-table th {
      text-align: left;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      background: #fafafa;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    .device-table td {
      padding: 6px 10px;
      font-size: var(--text-xs);
      border-bottom: 1px solid var(--border-soft);
      color: var(--fg-2);
      cursor: pointer;
      transition: background var(--motion-fast);
    }

    .device-table tr:last-child td { border-bottom: none; }

    .device-table tr:hover td { background: #f5f8ff; }

    .device-table tr.selected td {
      background: var(--accent-bg);
      position: relative;
    }

    .device-table tr.selected td:first-child {
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .device-name {
      font-weight: 500;
      color: var(--fg);
      font-size: var(--text-xs);
    }

    .device-type {
      font-size: 10px;
      color: var(--muted);
      display: block;
      margin-top: 1px;
    }

    /* ── 右列：详情面板 ── */
    .right-col {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .detail-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .detail-panel .panel-body {
      flex: 1;
      padding: var(--space-3);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .device-detail-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .detail-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 300px;
      color: var(--meta);
      text-align: center;
      padding: var(--space-6);
    }

    .detail-empty svg {
      width: 48px;
      height: 48px;
      margin-bottom: var(--space-4);
      opacity: 0.3;
    }

    .detail-empty p {
      font-size: var(--text-sm);
      line-height: 1.6;
    }

    /* ── 设备信息头（右上） ── */
    .device-info-header {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding-bottom: var(--space-3);
      border-bottom: 1px solid var(--border-soft);
      margin-bottom: var(--space-3);
    }

    .device-avatar {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      background: var(--accent-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .device-avatar svg {
      width: 18px;
      height: 18px;
      color: var(--accent);
    }

    .device-meta {
      flex: 1;
      min-width: 0;
    }

    .device-meta-name {
      font-size: var(--text-sm);
      font-weight: 600;
      color: var(--fg);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .device-meta-location {
      font-size: 11px;
      color: var(--muted);
      margin-top: 1px;
    }

    .device-meta-extra {
      display: flex;
      gap: var(--space-3);
      margin-top: 4px;
      font-size: 10px;
      color: var(--muted);
      flex-wrap: wrap;
    }

    .device-meta-extra span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* ── 参数网格（右下） ── */
    .param-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-3);
      margin-bottom: var(--space-4);
    }

    .param-card {
      background: #fafafa;
      border-radius: var(--radius-md);
      padding: 16px 18px;
      border: 1px solid var(--border-soft);
    }

    .param-label {
      font-size: var(--text-xs);
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .param-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .param-value {
      font-size: var(--text-2xl);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: var(--fg);
    }

    .param-value .unit {
      font-size: var(--text-sm);
      font-weight: 400;
      color: var(--muted);
      margin-left: 2px;
    }

    .param-range {
      font-size: var(--text-xs);
      color: var(--muted);
      margin-top: 4px;
    }

    .param-bar {
      height: 4px;
      border-radius: 3px;
      background: var(--border);
      margin-top: var(--space-2);
      overflow: hidden;
    }

    .param-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width var(--motion-base) var(--ease-standard);
    }

    /* ── 参数历史趋势图 ── */
    .chart-section {
      margin-top: var(--space-2);
      flex-shrink: 0;
    }
    .chart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-2);
    }
    .chart-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--fg);
      letter-spacing: 0.03em;
    }
    .chart-param-name {
      font-size: 11px;
      color: var(--accent);
      font-weight: 500;
    }
    .chart-wrap {
      background: #fafafa;
      border-radius: var(--radius-md);
      padding: 8px 12px;
      border: 1px solid var(--border-soft);
      position: relative;
    }
    .chart-wrap svg {
      display: block;
      width: 100%;
      height: 180px;
    }
    .chart-tooltip {
      position: absolute;
      background: var(--fg);
      color: var(--surface);
      font-size: 11px;
      font-family: var(--font-mono);
      padding: 4px 10px;
      border-radius: 6px;
      pointer-events: none;
      opacity: 0;
      transition: opacity var(--motion-fast);
      white-space: nowrap;
      transform: translateX(-50%);
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      font-weight: 500;
    }
    .chart-tooltip.show { opacity: 1; }

    /* ── 时间范围滑块 ── */
    .range-slider-wrap {
      margin-top: 8px;
      position: relative;
      height: 32px;
      padding: 0 8px;
    }
    .range-slider-track {
      position: absolute;
      top: 50%;
      left: 8px;
      right: 8px;
      height: 4px;
      background: var(--border-soft);
      border-radius: 2px;
      transform: translateY(-50%);
    }
    .range-slider-fill {
      position: absolute;
      top: 0;
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      opacity: 0.5;
    }
    .range-slider-handle {
      position: absolute;
      top: 50%;
      width: 14px;
      height: 14px;
      background: var(--surface);
      border: 2px solid var(--accent);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      cursor: ew-resize;
      z-index: 2;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
      transition: box-shadow var(--motion-fast);
    }
    .range-slider-handle:hover,
    .range-slider-handle:active {
      box-shadow: 0 1px 8px rgba(0,0,0,0.25);
    }
    .range-slider-time {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--muted);
      font-family: var(--font-mono);
      margin: 0 8px 2px;
    }

    /* 参数卡片点击交互 */
    .param-card {
      cursor: pointer;
      transition: border-color var(--motion-fast), box-shadow var(--motion-fast);
    }
    .param-card:hover {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .param-card.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
      background: #f0f5ff;
    }

    /* ── 告警 ── */
    .detail-section-title {
      font-size: 10px;
      font-weight: 600;
      color: var(--fg);
      margin-bottom: var(--space-2);
      margin-top: var(--space-2);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .detail-section-title:first-of-type { margin-top: 0; }

    /* 异常标记 */
    .alert-note {
      background: var(--warn-bg);
      border: 1px solid #ffe58f;
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      font-size: 11px;
      color: #d48806;
      display: flex;
      align-items: flex-start;
      gap: 6px;
      margin-top: var(--space-2);
    }

    .alert-note svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    /* ── 设备类型筛选按钮 ── */
    .type-filter-bar {
      display: flex;
      gap: 6px;
      padding: 6px 10px;
      flex-wrap: wrap;
    }
    .type-filter-btn {
      font-size: 11px;
      padding: 3px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      background: var(--surface);
      color: var(--fg-2);
      cursor: pointer;
      transition: all var(--motion-fast);
    }
    .type-filter-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .type-filter-btn.active {
      background: var(--accent);
      color: var(--accent-on);
      border-color: var(--accent);
    }
    /* 设备类型标签 */
    .dev-type-badge {
      display: inline-block;
      font-size: 9px;
      padding: 0 5px;
      border-radius: 3px;
      margin-right: 3px;
      vertical-align: middle;
    }
    .dev-type-soil {
      background: #e6f7ff;
      color: #1890ff;
    }
    .dev-type-weather {
      background: #fff7e6;
      color: #fa8c16;
    }

    /* ── 响应式 ── */
    @media (max-width: 900px) {
      .monitor-layout {
        flex-direction: column;
      }
      .left-col {
        width: 100%;
        min-width: 0;
      }
      .left-col .panel {
        max-height: 260px;
      }
      .param-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  /* HS-WEB 作业组件变量 → 黄陂 token 别名(AI决策紫#7B2CBF) */
  :root{--accent:var(--tech);--accent-bg:#E6F2FF;--accent-on:#fff;--border-soft:var(--border);--meta:var(--fg-3);--muted:var(--fg-2);--space-2:var(--sp-2);--space-3:var(--sp-3);--space-4:var(--sp-4);--space-6:var(--sp-6);--text-xs:12px;--text-sm:13px;--text-2xl:22px;--radius-sm:var(--r-sm);--radius-md:var(--r-md);--radius-pill:999px;--shadow-sm:var(--shadow);--success:var(--ok);--warn-bg:var(--warn-soft);--motion-base:.2s;--motion-fast:.15s;--ease-standard:cubic-bezier(.4,0,.2,1);}
  /* HS-WEB 作业组件变量 → 黄陂 token 别名（主色 AI 决策紫 #7B2CBF） */
  :root{--accent:var(--tech);--accent-bg:#E6F2FF;--accent-on:#fff;--border-soft:var(--border);--meta:var(--fg-3);--muted:var(--fg-2);--space-2:var(--sp-2);--space-3:var(--sp-3);--space-4:var(--sp-4);--space-6:var(--sp-6);--text-xs:12px;--text-sm:13px;--text-2xl:22px;--radius-sm:var(--r-sm);--radius-md:var(--r-md);--radius-pill:999px;--shadow-sm:var(--shadow);--success:var(--ok);--warn-bg:var(--warn-soft);--motion-base:.2s;--motion-fast:.15s;--ease-standard:cubic-bezier(.4,0,.2,1);}
  /* 修复: 黄陂 .page 包裹层断了 HS-WEB monitor-layout 的 flex 链，补回 */
  .admin .content > .page{flex:1;display:flex;flex-direction:column;min-height:0;padding:0;overflow:hidden}
  .admin .content > .page > .monitor-layout{flex:1;min-height:0;padding:var(--space-4);box-sizing:border-box;align-items:stretch}
  .alert-trigger-btn{margin-left:auto;display:inline-flex;align-items:center;gap:5px;padding:5px 13px;border-radius:6px;background:var(--danger);color:#fff;border:none;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
  .alert-trigger-btn:hover{opacity:.88}
  .alert-mask{position:fixed;inset:0;background:rgba(10,25,41,.5);z-index:9999;display:flex;align-items:center;justify-content:center;animation:fadeIn .15s}
  .alert-modal{background:#fff;border-radius:14px;width:460px;max-width:92vw;max-height:82vh;display:flex;flex-direction:column;box-shadow:0 16px 48px rgba(0,0,0,.22);overflow:hidden}
  .alert-modal__head{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--border);background:linear-gradient(90deg,#FFF1F0,#FFF7F5)}
  .alert-modal__title{font-size:15px;font-weight:700;color:var(--danger);display:flex;align-items:center;gap:8px}
  .alert-modal__close{background:none;border:none;font-size:24px;color:var(--muted);cursor:pointer;line-height:1;padding:0 4px}
  .alert-modal__body{padding:16px 20px;overflow-y:auto;flex:1}
  .alert-modal__foot{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;background:var(--surface-2,#fafafa)}
  .alert-tip{font-size:13px;color:var(--fg,#333);margin-bottom:12px;line-height:1.6}
  .alert-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
  .alert-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#FFF5F5;border:1px solid #FFD6D6;border-radius:8px;font-size:12px}
  .alert-item__name{font-weight:600;color:#333;min-width:72px}
  .alert-item__val{font-family:var(--font-mono);font-weight:700;min-width:62px}
  .alert-item__range{color:var(--muted);flex:1}
  .alert-item__tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;background:#FFE0E0;color:var(--danger)}
  .alert-suggest{font-size:12px;color:#444;background:#F0F7FF;border-radius:8px;padding:11px 13px;line-height:1.65;border-left:3px solid var(--accent)}
  .alert-ok{text-align:center;padding:26px 10px;color:var(--ok,#52c41a);font-size:14px;line-height:1.7}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  </style>
</head>

    // ── 渲染设备列表 ──

        html += '<tr class="' + sel + '" data-id="' + d.id + '" onclick="selectDevice(\'' + d.id + '\')">';

      }

      document.getElementById('deviceCount').textContent = devices.length + '台';

      if (selectedId && devices.some(function(d) { return d.id === selectedId; })) {

    }

    // ── 生成72小时历史趋势数据（带日期） ──
    function generateHistory(device) {
      var history = {};
      for (var p = 0; p < device.params.length; p++) {
        var param = device.params[p];
        var baseNum = parseFloat(param.value);
        var data = [];
        var now = new Date();
        // 24个点，跨越3天
        var totalHours = 72;
        var step = totalHours / (24 - 1);
        for (var i = 23; i >= 0; i--) {
          var t = new Date(now);
          t.setHours(t.getHours() - Math.round(i * step));
          t.setMinutes(0);
          var month = ('0' + (t.getMonth() + 1)).slice(-2);
          var day = ('0' + t.getDate()).slice(-2);
          var hour = ('0' + t.getHours()).slice(-2);
          var timeStr = month + '-' + day + ' ' + hour + ':00';
          var variation = (Math.random() - 0.5) * baseNum * 0.3;
          var val = Math.round((baseNum + variation) * 100) / 100;
          data.push({ time: timeStr, value: val, ts: t.getTime() });
        }
        history[param.key] = data;
      }
      return history;
    }

    var rangeLeft = 0, rangeRight = 100, isDragging = null;

    // ── 渲染 SVG 趋势图 ──
    function renderChart(device, paramKey) {
      var param = null;
      for (var i = 0; i < device.params.length; i++) {
        if (device.params[i].key === paramKey) { param = device.params[i]; break; }
      }
      if (!param) return '';

      var history = device._history || (device._history = generateHistory(device));
      var allData = history[paramKey];
      if (!allData || allData.length === 0) return '';

      // 应用范围滑块过滤
      var len = allData.length;
      var startIdx = Math.round(rangeLeft / 100 * (len - 1));
      var endIdx = Math.round(rangeRight / 100 * (len - 1));
      startIdx = Math.max(0, Math.min(startIdx, len - 2));
      endIdx = Math.max(startIdx + 1, Math.min(endIdx, len - 1));
      var data = allData.slice(startIdx, endIdx + 1);

      var container = document.querySelector('.right-col');
      var w = container ? Math.max(400, container.offsetWidth - 48) : 800;
      var h = 180;
      var padL = 46, padR = 16, padT = 16, padB = 28;
      var plotW = w - padL - padR;
      var plotH = h - padT - padB;

      // 值域
      var vals = data.map(function(d) { return d.value; });
      var vMin = Math.min.apply(null, vals);
      var vMax = Math.max.apply(null, vals);
      var vRange = vMax - vMin || 1;
      var yPad = vRange * 0.12;
      var yMin = vMin - yPad;
      var yMax = vMax + yPad;
      var yRange = yMax - yMin;

      // Y轴刻度（5条横线 + 标签）
      var ySteps = 4;
      var yLabels = [];
      for (var y = 0; y <= ySteps; y++) {
        yLabels.push(Number((yMin + (yRange * y / ySteps)).toFixed(1)));
      }

      // 坐标转换
      function valToY(v) { return padT + plotH - ((v - yMin) / yRange * plotH); }
      function idxToX(idx) { return padL + (idx / (data.length - 1)) * plotW; }

      // X轴标签（取头中尾，最多6个）
      var xLabelCount = Math.min(data.length, 6);
      var xLabelIdxes = [];
      for (var i = 0; i < xLabelCount; i++) {
        xLabelIdxes.push(Math.round(i * (data.length - 1) / (xLabelCount - 1)));
      }

      // 折线路径
      var points = [];
      for (var i = 0; i < data.length; i++) {
        points.push(idxToX(i) + ',' + valToY(data[i].value));
      }
      var linePath = 'M' + points.join(' L');

      // 面积填充
      var areaPath = linePath + ' L' + idxToX(data.length - 1) + ',' + (padT + plotH) + ' L' + idxToX(0) + ',' + (padT + plotH) + ' Z';

      var color = param.dot || '#2f6feb';

      // 数据点圆
      var dotsHtml = '';
      for (var i = 0; i < data.length; i++) {
        var showDot = i === data.length - 1;
        dotsHtml += '<circle cx="' + idxToX(i) + '" cy="' + valToY(data[i].value) + '" r="' + (showDot ? 3.5 : 2) + '" ' +
          'fill="' + (showDot ? color : 'white') + '" stroke="' + color + '" stroke-width="1.5" ' +
          'data-idx="' + i + '" data-time="' + data[i].time + '" data-val="' + data[i].value + '" ' +
          'style="cursor:pointer" ' +
          'onmouseenter="showChartTooltip(event,this)" onmouseleave="hideChartTooltip()" />';
      }

      // 构建SVG网格+折线
      var gridHtml = '';
      for (var y = 0; y <= ySteps; y++) {
        var yy = padT + plotH - (plotH * y / ySteps);
        var isMid = y > 0 && y < ySteps;
        gridHtml += '<line x1="' + padL + '" y1="' + yy + '" x2="' + (w - padR) + '" y2="' + yy + '" stroke="' + (isMid ? '#eee' : '#ddd') + '" stroke-width="' + (isMid ? '0.5' : '1') + '"/>';
        gridHtml += '<text x="' + (padL - 6) + '" y="' + (yy + 4) + '" text-anchor="end" fill="#888" font-size="11" font-family="ui-monospace,monospace">' + yLabels[y] + '</text>';
      }
      // 竖线 + X轴日期标签
      for (var xi = 0; xi < xLabelIdxes.length; xi++) {
        var ii = xLabelIdxes[xi];
        var xx = idxToX(ii);
        gridHtml += '<line x1="' + xx + '" y1="' + padT + '" x2="' + xx + '" y2="' + (padT + plotH) + '" stroke="#eee" stroke-width="0.5" stroke-dasharray="2,3"/>';
        var timeParts = data[ii].time.split(' ');
        gridHtml += '<text x="' + xx + '" y="' + (padT + plotH + 16) + '" text-anchor="middle" fill="#888" font-size="10" font-family="ui-monospace,monospace">' + timeParts[0] + '</text>';
        gridHtml += '<text x="' + xx + '" y="' + (padT + plotH + 28) + '" text-anchor="middle" fill="#aaa" font-size="9" font-family="ui-monospace,monospace">' + (timeParts[1] || '') + '</text>';
      }

      var gradId = 'grad_' + paramKey.replace(/[^a-zA-Z0-9]/g, '_');

      return '<div class="chart-section">' +
        '<div class="chart-header">' +
          '<div class="chart-title">历史趋势</div>' +
          '<div class="chart-param-name">' + param.label + ' (' + param.unit + ')' + '</div>' +
        '</div>' +
        '<div class="chart-wrap">' +
          '<div class="chart-tooltip" id="chartTooltip"></div>' +
          '<svg width="' + w + '" height="' + h + '">' +
            gridHtml +
            '<defs>' +
              '<linearGradient id="' + gradId + '" x1="0" y1="0" x2="0" y2="1">' +
                '<stop offset="0%" stop-color="' + color + '" stop-opacity="0.18"/>' +
                '<stop offset="100%" stop-color="' + color + '" stop-opacity="0.02"/>' +
              '</linearGradient>' +
            '</defs>' +
            '<path d="' + areaPath + '" fill="url(#' + gradId + ')" />' +
            '<path d="' + linePath + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
            dotsHtml +
          '</svg>' +
        '</div>' +
        '<div class="range-slider-time">' +
          '<span>' + allData[0].time + '</span>' +
          '<span>拖动时间范围</span>' +
          '<span>' + allData[allData.length - 1].time + '</span>' +
        '</div>' +
        '<div class="range-slider-wrap" id="rangeSliderWrap">' +
          '<div class="range-slider-track"></div>' +
          '<div class="range-slider-fill" id="rangeFill" style="left:' + rangeLeft + '%;width:' + (rangeRight - rangeLeft) + '%"></div>' +
          '<div class="range-slider-handle" id="rangeHandleL" style="left:' + rangeLeft + '%" onmousedown="startDrag(event,\'L\')"></div>' +
          '<div class="range-slider-handle" id="rangeHandleR" style="left:' + rangeRight + '%" onmousedown="startDrag(event,\'R\')"></div>' +
        '</div>' +
      '</div>';
    }

    // ── 滑块拖拽逻辑 ──
    function startDrag(e, side) {
      e.preventDefault();
      isDragging = side;
      document.addEventListener('mousemove', onDrag);
      document.addEventListener('mouseup', stopDrag);
    }
    function onDrag(e) {
      var wrap = document.getElementById('rangeSliderWrap');
      if (!wrap || !isDragging) return;
      var rect = wrap.getBoundingClientRect();
      var pct = (e.clientX - rect.left) / rect.width * 100;
      pct = Math.max(0, Math.min(100, pct));
      if (isDragging === 'L') {
        if (pct >= rangeRight - 5) pct = rangeRight - 5;
        rangeLeft = pct;
      } else {
        if (pct <= rangeLeft + 5) pct = rangeLeft + 5;
        rangeRight = pct;
      }
      document.getElementById('rangeHandleL').style.left = rangeLeft + '%';
      document.getElementById('rangeHandleR').style.left = rangeRight + '%';
      document.getElementById('rangeFill').style.left = rangeLeft + '%';
      document.getElementById('rangeFill').style.width = (rangeRight - rangeLeft) + '%';
      // 重新渲染图表
      var device = getCurrentDevice();
      if (device) showDeviceDetail(device.id);
    }
    function stopDrag() {
      isDragging = null;
      document.removeEventListener('mousemove', onDrag);
      document.removeEventListener('mouseup', stopDrag);
    }

    function getCurrentDevice() {
      if (!selectedId) return null;
      for (var i = 0; i < DEVICES.length; i++) {
        if (DEVICES[i].id === selectedId) return DEVICES[i];
      }
      return null;
    }

    // ── 图表 Tooltip ──
    function showChartTooltip(e, el) {
      var tip = document.getElementById('chartTooltip');
      if (!tip) return;
      var time = el.getAttribute('data-time');
      var val = el.getAttribute('data-val');
      tip.textContent = time + '  ' + val;
      tip.className = 'chart-tooltip show';
      var wrap = el.closest('.chart-wrap');
      if (!wrap) return;
      var wrapRect = wrap.getBoundingClientRect();
      var left = e.clientX - wrapRect.left;
      left = Math.max(10, Math.min(left, wrapRect.width - 10));
      tip.style.left = left + 'px';
      tip.style.top = '-4px';
    }
    function hideChartTooltip() {
      var tip = document.getElementById('chartTooltip');
      if (tip) tip.className = 'chart-tooltip';
    }

    var currentChartParam = null;

    // ── 渲染设备详情 ──
    function showDeviceDetail(id) {
      var device = null;
      for (var i = 0; i < DEVICES.length; i++) {
        if (DEVICES[i].id === id) { device = DEVICES[i]; break; }
      }
      if (!device) return;

      var detailBody = document.getElementById('detailBody');
      document.getElementById('detailEmpty').style.display = 'none';

      var isWeather = device.deviceType === 'weather';

      // ── 设备信息头 ──
      var infoHeader = '';
      var nodesHtml = '';
      if (isWeather) {
        var wOfflineLabel = device.online
          ? '<span class="status-pill ' + device.statusClass + '" style="font-size:11px;padding:1px 8px;"><span class="status-dot"></span>' + device.status + '</span>'
          : '<span style="display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--meta);background:var(--border-soft);padding:1px 8px;border-radius:var(--radius-pill);"><svg viewBox="0 0 16 16" fill="currentColor" width="12" height="12"><path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/></svg> 离线</span>';
        infoHeader =
          '<div class="device-info-header">' +
            '<div class="device-avatar"><svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 2a8 8 0 100 16 8 8 0 000-16zm-1 5a1 1 0 112 0 1 1 0 01-2 0zm1 4a1 1 0 011 1v2a1 1 0 11-2 0v-2a1 1 0 011-1z"/></svg></div>' +
            '<div class="device-meta">' +
              '<div class="device-meta-name">' + device.name +
                ' <span style="font-family:var(--font-mono);font-size:10px;color:var(--muted);background:var(--border-soft);padding:0 6px;border-radius:3px;">' + device.id + '</span>' +
                wOfflineLabel +
              '</div>' +
              '<div class="device-meta-location">' + device.plotLabel +
                ' · 经度 ' + device.lng + ' 纬度 ' + device.lat + '</div>' +
              '<div class="device-meta-extra">' +
                '<span>采集间隔 ' + device.saveDataInterval + '分</span>' +
                '<span>离线判定 ' + device.offlineInterval + '分</span>' +
                (device.online ? '<span>● 设备启用</span>' : '') +
              '</div>' +
            '</div>' +
          '</div>';

        nodesHtml = '<div class="detail-section-title">传感器节点 (' + device.nodeInfoList.length + ')</div>';
        nodesHtml += '<div style="display:flex;flex-direction:column;gap:4px;margin-bottom:var(--space-3);">';
        for (var ni = 0; ni < device.nodeInfoList.length; ni++) {
          var nd = device.nodeInfoList[ni];
          var moldBg = nd.nodeMold === '雨量' ? '#e6fffb' : (nd.nodeMold === '蒸发量' ? '#fff7e6' : '#e6f7ff');
          var moldColor = nd.nodeMold === '雨量' ? '#13c2c2' : (nd.nodeMold === '蒸发量' ? '#fa8c16' : '#1890ff');
          nodesHtml +=
            '<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:#fafafa;border-radius:var(--radius-sm);border:1px solid var(--border-soft);">' +
              '<div style="display:flex;align-items:center;gap:8px;min-width:0;">' +
                '<span style="font-family:var(--font-mono);font-size:10px;color:var(--muted);background:var(--surface);padding:0 5px;border-radius:3px;border:1px solid var(--border-soft);">' + nd.nodeId + '</span>' +
                '<span style="font-size:var(--text-xs);color:var(--fg);font-weight:500;">' + nd.nodeName + '</span>' +
                '<span style="font-size:9px;padding:1px 6px;border-radius:var(--radius-pill);font-weight:500;background:' + moldBg + ';color:' + moldColor + ';">' + nd.nodeMold + '</span>' +
              '</div>' +
              '<div style="display:flex;align-items:center;gap:4px;font-size:10px;">' +
                '<span style="width:6px;height:6px;border-radius:50%;background:' + (nd.enable ? 'var(--success)' : 'var(--meta)') + ';"></span>' +
                (nd.enable ? '启用' : '停用') +
              '</div>' +
            '</div>';
        }
        nodesHtml += '</div>';
      } else {
        infoHeader =
          '<div class="device-info-header">' +
            '<div class="device-avatar"><svg viewBox="0 0 20 20" fill="currentColor"><path d="M3 4a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4zm.5 5a.5.5 0 01.5-.5h3.5a.5.5 0 010 1H4a.5.5 0 01-.5-.5zm0 3a.5.5 0 01.5-.5h3.5a.5.5 0 010 1H4a.5.5 0 01-.5-.5zm0 3a.5.5 0 01.5-.5h3.5a.5.5 0 010 1H4a.5.5 0 01-.5-.5zm8-6a.5.5 0 01.5-.5h3.5a.5.5 0 010 1H12a.5.5 0 01-.5-.5zm0 3a.5.5 0 01.5-.5h3.5a.5.5 0 010 1H12a.5.5 0 01-.5-.5zm0 3a.5.5 0 01.5-.5h3.5a.5.5 0 010 1H12a.5.5 0 01-.5-.5z"/></svg></div>' +
            '<div class="device-meta">' +
              '<div class="device-meta-name">' + device.id +
                '<span class="status-pill ' + device.statusClass + '" style="font-size:11px;padding:1px 8px;"><span class="status-dot"></span>' + device.status + '</span>' +
              '</div>' +
              '<div class="device-meta-location">' + device.name + ' · ' + device.plotLabel + '</div>' +
              '<div class="device-meta-extra">' +
                '<span><svg viewBox="0 0 16 16" fill="currentColor" width="12" height="12"><path d="M2.5 8a5.5 5.5 0 0111 0 5.5 5.5 0 01-11 0zM8 4a4 4 0 100 8 4 4 0 000-8z"/></svg> ' + device.protocol + '</span>' +
                '<span><svg viewBox="0 0 16 16" fill="currentColor" width="12" height="12"><path d="M8 1a.5.5 0 01.5.5v.69A7.002 7.002 0 0115 9h.5a.5.5 0 010 1h-.69A7.002 7.002 0 019 14.81v.69a.5.5 0 01-1 0v-.69A7.002 7.002 0 011 10h-.5a.5.5 0 010-1h.69A7.002 7.002 0 017.5 2.19V1.5A.5.5 0 018 1zm0 2a6 6 0 100 12A6 6 0 008 3z"/></svg> ' + device.battery + '%</span>' +
                '<span><svg viewBox="0 0 16 16" fill="currentColor" width="12" height="12"><path fill-rule="evenodd" d="M1 4.5A1.5 1.5 0 012.5 3h11A1.5 1.5 0 0115 4.5V12a1 1 0 01-1 1H2a1 1 0 01-1-1V4.5zm1.5 0h11V6h-11V4.5zM2 12V7h12v5H2z"/></svg> 校准 ' + device.calibration + '</span>' +
                '<span style="color:var(--accent);font-weight:500;">地址 ' + (device.deviceAddr || device.id) + '</span>' +
                '<span>保存 ' + (device.saveDataInterval || 30) + '分</span>' +
                '<span>离线 ' + (device.offlineInterval || 10) + '分</span>' +
              '</div>' +
            '</div>' +
          '</div>';

        nodesHtml = '<div class="detail-section-title">节点信息</div>' +
          '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:var(--space-3);">' +
            (device.nodeInfoList && device.nodeInfoList.length ? device.nodeInfoList.map(function(n) {
              return '<span style="display:inline-flex;align-items:center;gap:4px;background:#f5f8ff;border:1px solid #d6e4ff;border-radius:6px;padding:4px 10px;font-size:11px;color:var(--fg-2);">' +
                '<span style="font-weight:600;color:var(--accent);">' + n.nodeId + '</span>' +
                '<span>' + n.nodeName + '</span>' +
                '<span style="color:var(--muted);font-size:10px;">' + n.nodeMold + '</span>' +
                '<span style="color:var(--muted);font-size:10px;background:var(--border-soft);padding:0 5px;border-radius:4px;">' + n.nodeType + '</span>' +
                (n.enable ? '<span style="color:#52c41a;font-size:10px;">●启用</span>' : '<span style="color:#ff4d4f;font-size:10px;">○停用</span>') +
              '</span>';
            }).join('') : '<span style="font-size:11px;color:var(--muted);">无节点信息</span>') +
          '</div>';
      }

      var paramCards = '';
      for (var i = 0; i < device.params.length; i++) {
        var p = device.params[i];
        var barColor = p.status === 'high' ? '#ff4d4f' : (p.status === 'low' ? '#faad14' : '#52c41a');
        var pct = Math.min(p.pct, 100);
        var activeClass = currentChartParam === p.key ? ' active' : '';
        paramCards += '<div class="param-card' + activeClass + '" onclick="switchChart(\'' + device.id + '\',\'' + p.key + '\')">';
        paramCards += '<div class="param-label"><span class="param-dot" style="background:' + p.dot + '"></span>' + p.label + '</div>';
        paramCards += '<div class="param-value">' + p.value + '<span class="unit">' + p.unit + '</span></div>';
        paramCards += '<div class="param-range">范围 ' + (p.min !== undefined ? p.min + '–' + p.max : '') + (p.unit || '') + '</div>';
        paramCards += '<div class="param-bar"><div class="param-bar-fill" style="width:' + pct + '%;background:' + barColor + '"></div></div>';
        paramCards += '</div>';
      }

      if (!currentChartParam || !device.params.some(function(p) { return p.key === currentChartParam; })) {
        currentChartParam = device.params[0].key;
      }

      var chartHtml = renderChart(device, currentChartParam);

      var alertHtml = '';
      if (device.alerts) {
        alertHtml = '<div class="alert-note"><svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z"/></svg>' + device.alerts + '</div>';
      }

      var alarmBadgeHtml = '';
      if (device.readings && device.readings.length > 0) {
        var latestReading = device.readings[0];
        var alarmStatus = latestReading.alarmStatus || 0;
        if (alarmStatus === 1) {
          alarmBadgeHtml = '<span style="display:inline-flex;align-items:center;gap:4px;background:#fff2f0;color:#ff4d4f;padding:1px 8px;border-radius:10px;font-size:10px;font-weight:500;">● 报警中</span>';
        } else {
          alarmBadgeHtml = '<span style="display:inline-flex;align-items:center;gap:4px;background:#f6ffed;color:#52c41a;padding:1px 8px;border-radius:10px;font-size:10px;font-weight:500;">● 正常</span>';
        }
      }

      detailBody.innerHTML =
        '<!-- 设备信息头 -->' +
        infoHeader +
        '<!-- 实时参数 -->' +
        '<div class="detail-section-title">' +
          '实时参数' +
          (alarmBadgeHtml ? '<span style="display:inline-flex;align-items:center;gap:4px;margin-left:8px;font-size:10px;font-weight:500;padding:1px 8px;border-radius:10px;">' + alarmBadgeHtml + '</span>' : '') +
          '<button class="alert-trigger-btn" onclick="showAlertModal(\'' + device.id + '\')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2 2 20h20L12 2z"/><path d="M12 9v5M12 17h.01"/></svg>系统预警</button>' +
        '</div>' +
        '<div class="param-grid">' + paramCards + '</div>' +
        chartHtml +
        alertHtml;
    }
    // ── 系统预警弹窗 ──
    function showAlertModal(deviceId){
      var device = null;
      for(var i=0;i<DEVICES.length;i++){ if(DEVICES[i].id===deviceId){ device=DEVICES[i]; break; } }
      if(!device){ return; }
      var over = [];
      for(var k=0;k<device.params.length;k++){
        var p = device.params[k];
        if(p.status==='high' || p.status==='low'){ over.push(p); }
      }
      var body = '';
      if(over.length===0){
        body = '<div class="alert-ok">✓ 当前设备各项采集参数<br>均在安全阈值范围内<br><span style="font-size:12px;color:var(--muted);">暂无预警</span></div>';
      } else {
        body = '<div class="alert-tip">检测到 <b style="color:var(--danger)">'+over.length+'</b> 项采集参数超出安全阈值，<br>建议立即进行<b>水肥供给动态调控</b>：</div>';
        body += '<div class="alert-list">';
        for(var j=0;j<over.length;j++){
          var op = over[j];
          body += '<div class="alert-item">'+
            '<div class="alert-item__name">'+op.label+'</div>'+
            '<div class="alert-item__val" style="color:'+(op.status==='high'?'var(--danger)':'var(--warn,#faad14)')+'">'+op.value+(op.unit||'')+'</div>'+
            '<div class="alert-item__range">安全 '+(op.min!==undefined?op.min+'–'+op.max:'—')+(op.unit||'')+'</div>'+
            '<span class="alert-item__tag">'+(op.status==='high'?'↑ 超上限':'↓ 低于下限')+'</span>'+
          '</div>';
        }
        body += '</div>';
        body += '<div class="alert-suggest"><b>调控建议：</b>根据超阈值参数调整灌溉量与氮磷钾配比；可前往 AI 决策平台「<b>水肥调控模型</b>」，按当前墒情自动生成水肥方案并联动电磁阀执行。</div>';
      }
      var mask = document.getElementById('alertMask');
      if(!mask){
        mask = document.createElement('div');
        mask.id = 'alertMask';
        mask.className = 'alert-mask';
        mask.setAttribute('onclick','if(event.target===this)closeAlertModal()');
        mask.innerHTML =
          '<div class="alert-modal" onclick="event.stopPropagation()">'+
            '<div class="alert-modal__head">'+
              '<div class="alert-modal__title"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 2 20h20L12 2z"/><path d="M12 9v5M12 17h.01"/></svg>系统预警</div>'+
              '<button class="alert-modal__close" onclick="closeAlertModal()">×</button>'+
            '</div>'+
            '<div class="alert-modal__body" id="alertModalBody"></div>'+
            '<div class="alert-modal__foot">'+
              '<a href="ai-platform.html" style="padding:7px 16px;border-radius:6px;background:var(--accent);color:#fff;font-size:13px;text-decoration:none;font-weight:600">去水肥调控模型</a>'+
              '<button onclick="closeAlertModal()" style="padding:7px 16px;border-radius:6px;border:1px solid var(--border);background:#fff;color:#666;font-size:13px;cursor:pointer">知道了</button>'+
            '</div>'+
          '</div>';
        document.body.appendChild(mask);
      }
      document.getElementById('alertModalBody').innerHTML = body;
      mask.style.display = 'flex';
    }
    function closeAlertModal(){
      var m = document.getElementById('alertMask');
      if(m){ m.style.display = 'none'; }
    }

    // ── 切换图表参数 ──
    function switchChart(deviceId, paramKey) {
      currentChartParam = paramKey;
      showDeviceDetail(deviceId);
    }

    // ── 搜索过滤 ──
    function filterDevices(keyword) {
      currentFilter = keyword;
      renderDeviceList();
    }

    // ── 设备类型筛选 ──
    function filterByDeviceType(type) {
      currentTypeFilter = type;
      var btns = document.querySelectorAll('.type-filter-btn');
      btns.forEach(function(b) { b.classList.remove('active'); });
      var targetBtn = document.getElementById(type === 'all' ? 'filterAll' : (type === 'soil' ? 'filterSoil' : 'filterWeather'));
      if (targetBtn) targetBtn.classList.add('active');
      renderDeviceList();
    }

    // ── 初始化（renderSidebar 已移除，改用内联黄陂侧栏）──

    if (DEVICES.length > 0) {
      selectDevice(DEVICES[0].id);
    }
  </script>
</body>
</html>
